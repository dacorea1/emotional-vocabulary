<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Language for Feeling</title>
<style>
:root{--paper:#F5EEDC;--ink:#3D382F;--brass:#9A7740;}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{text-align:center;padding:32px 16px 8px}h1{font:500 clamp(28px,4vw,52px) Georgia,serif;letter-spacing:.08em;margin:0}header p{letter-spacing:.12em;font-size:12px;color:var(--brass);text-transform:uppercase}
main{display:grid;grid-template-columns:minmax(0,1fr) 310px;max-width:1380px;margin:auto;gap:18px;padding:10px 20px 40px;align-items:center}#wheelWrap{overflow:auto;display:flex;justify-content:center;align-items:center;max-height:86vh;border-radius:8px}#wheel{width:min(100%,980px);height:auto;min-width:860px;display:block}
#panel{align-self:center;position:sticky;top:16px;border:1px solid #d8cdb6;padding:24px;background:#f8f2e4}#panel h2{font:500 30px Georgia,serif;margin:0 0 8px}#path{line-height:1.7;min-height:70px}
button{background:transparent;border:1px solid var(--brass);padding:9px 14px;color:var(--ink);cursor:pointer}
.slice{cursor:pointer;transition:opacity .15s,filter .15s}.slice:hover{filter:brightness(.94)}.dim{opacity:.16}
.label{pointer-events:none;fill:#3D382F;font-size:10px}.midlabel{font-weight:650;font-size:11px}.corelabel{fill:#F5EEDC;font-weight:750;font-size:13px;letter-spacing:.04em}
@media(max-width:980px){main{grid-template-columns:1fr}#panel{order:-1;position:static}#wheel{min-width:860px}}
</style></head><body>
<header><h1>OUR LANGUAGE FOR FEELING</h1><p>Begin at the center · move outward · find the closest word</p></header>
<main><div id="wheelWrap"><svg id="wheel" viewBox="0 0 1100 1100" aria-label="Interactive emotional word wheel"></svg></div>
<aside id="panel"><h2>What am I feeling?</h2><div id="path">Hover, tap, or click any word to highlight its path from broad feeling to specific vocabulary.</div><button id="reset">Reset</button></aside></main>
<script>
const data={"Happy": {"Optimistic": ["Inspired", "Hopeful"], "Trusting": ["Intimate", "Sensitive"], "Peaceful": ["Thankful", "Loving"], "Powerful": ["Creative", "Courageous"], "Accepted": ["Valued", "Respected"], "Proud": ["Confident", "Successful"], "Interested": ["Inquisitive", "Curious"], "Content": ["Joyful", "Free"], "Playful": ["Cheeky", "Aroused"]}, "Surprised": {"Excited": ["Energetic", "Eager"], "Amazed": ["Astonished", "Awe"], "Confused": ["Perplexed", "Disillusioned"], "Startled": ["Dismayed", "Shocked"]}, "Bad": {"Tired": ["Unfocused", "Sleepy"], "Stressed": ["Out of control", "Overwhelmed"], "Busy": ["Rushed", "Pressured"], "Bored": ["Apathetic", "Indifferent"]}, "Fearful": {"Scared": ["Helpless", "Frightened"], "Anxious": ["Overwhelmed", "Worried"], "Insecure": ["Inadequate", "Inferior"], "Weak": ["Worthless", "Insignificant"], "Rejected": ["Excluded", "Persecuted"], "Threatened": ["Nervous", "Exposed"]}, "Angry": {"Let down": ["Betrayed", "Resentful"], "Humiliated": ["Disrespected", "Ridiculed"], "Bitter": ["Indignant", "Violated"], "Mad": ["Furious", "Jealous"], "Aggressive": ["Provoked", "Hostile"], "Frustrated": ["Infuriated", "Annoyed"], "Distant": ["Withdrawn", "Numb"], "Critical": ["Skeptical", "Dismissive"]}, "Disgusted": {"Disapproving": ["Judgmental", "Embarrassed"], "Disappointed": ["Appalled", "Revolted"], "Awful": ["Nauseated", "Detestable"], "Repelled": ["Horrified", "Hesitant"]}, "Sad": {"Lonely": ["Isolated", "Abandoned"], "Vulnerable": ["Victimized", "Fragile"], "Despair": ["Grief", "Powerless"], "Guilty": ["Ashamed", "Remorseful"], "Depressed": ["Empty", "Inferior"], "Hurt": ["Embarrassed", "Disappointed"]}},colors={"Happy": "#D4A24C", "Surprised": "#A78978", "Bad": "#7E8768", "Fearful": "#657B70", "Angry": "#A85F48", "Disgusted": "#786F57", "Sad": "#6E7E88"};const svg=document.querySelector('#wheel'),NS='http://www.w3.org/2000/svg',cx=550,cy=550,R=[132,265,405,520];
const leaves=[];Object.entries(data).forEach(([c,ms])=>Object.entries(ms).forEach(([m,ts])=>ts.forEach(t=>leaves.push([c,m,t]))));
const n=leaves.length,step=360/n,start=-90;
function polar(r,a){a=a*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function path(r1,r2,a0,a1){let A=polar(r2,a0),B=polar(r2,a1),C=polar(r1,a1),D=polar(r1,a0);return`M${A} A${r2},${r2} 0 0 1 ${B} L${C} A${r1},${r1} 0 0 0 ${D} Z`}
function el(tag,attrs={}){let e=document.createElementNS(NS,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);svg.appendChild(e);return e}
function upright(rot){let r=((rot+180)%360)-180;if(r>90)r-=180;if(r<-90)r+=180;return r}
function splitLabel(text){if(text.length<=11)return[text];if(text.includes(' ')){const w=text.split(' ');if(w.length===2)return w;let best=[text],d=999;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' '),x=Math.abs(a.length-b.length);if(x<d){best=[a,b];d=x}}return best}return[text]}
function addMultilineText(x,y,rotation,lines,cls,fontSize){const g=el('g',{transform:`translate(${x} ${y}) rotate(${rotation})`});const t=document.createElementNS(NS,'text');t.setAttribute('class',cls);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-size',fontSize);g.appendChild(t);const lh=fontSize*1.08;lines.forEach((line,i)=>{const ts=document.createElementNS(NS,'tspan');ts.setAttribute('x','0');ts.setAttribute('y',((i-(lines.length-1)/2)*lh).toFixed(2));ts.textContent=line;t.appendChild(ts)});return t}
const labelNodes=[];
let idx=0,ranges={},mr={};
Object.entries(data).forEach(([c,ms])=>{let cs=idx;Object.entries(ms).forEach(([m,ts])=>{let s=idx;ts.forEach(t=>{let a0=start+idx*step,a1=a0+step,am=(a0+a1)/2,p=el('path',{d:path(R[2],R[3],a0,a1),fill:colors[c],'fill-opacity':.23,stroke:'#F5EEDC','stroke-width':1.2,class:'slice','data-c':c,'data-m':m,'data-t':t}),q=polar((R[2]+R[3])/2,am),rot=upright(am+90),lines=splitLabel(t),fs=t.length>17?9.6:(t.length>13?10.5:12),tx=addMultilineText(q[0],q[1],rot,lines,'label',fs);labelNodes.push({node:tx,kind:'outer'});p.addEventListener('mouseenter',()=>select(c,m,t));p.addEventListener('click',()=>select(c,m,t));idx++});mr[c+'|'+m]=[s,idx]});ranges[c]=[cs,idx]});
Object.entries(mr).forEach(([key,[s,e]])=>{let[c,m]=key.split('|'),a0=start+s*step,a1=start+e*step,am=(a0+a1)/2;el('path',{d:path(R[1],R[2],a0,a1),fill:colors[c],'fill-opacity':.48,stroke:'#F5EEDC','stroke-width':1.5,class:'slice','data-c':c,'data-m':m});let q=polar((R[1]+R[2])/2,am),rot=upright(am+90),lines=splitLabel(m),fs=m.length>12?10.8:12,tx=addMultilineText(q[0],q[1],rot,lines,'label midlabel',fs);labelNodes.push({node:tx,kind:'mid'})});
Object.entries(ranges).forEach(([c,[s,e]])=>{let a0=start+s*step,a1=start+e*step,am=(a0+a1)/2;el('path',{d:path(R[0],R[1],a0,a1),fill:colors[c],'fill-opacity':.82,stroke:'#F5EEDC','stroke-width':2,class:'slice','data-c':c});let q=polar((R[0]+R[1])/2,am),rot=upright(am+90),tx=addMultilineText(q[0],q[1],rot,[c.toUpperCase()],'label corelabel',14);labelNodes.push({node:tx,kind:'core'})});
el('circle',{cx,cy,r:R[0]-4,fill:'#F5EEDC',stroke:'#9A7740','stroke-width':1.5});
let c1=el('text',{x:cx,y:cy-7,'text-anchor':'middle',fill:'#3D382F',style:'font:18px Georgia,serif'});c1.textContent='What am I';
let c2=el('text',{x:cx,y:cy+18,'text-anchor':'middle',fill:'#3D382F',style:'font:18px Georgia,serif'});c2.textContent='feeling?';

function boxesOverlap(a,b,pad=2){return !(a.x+a.width+pad<b.x||b.x+b.width+pad<a.x||a.y+a.height+pad<b.y||b.y+b.height+pad<a.y)}
function collisionPass(){for(const kind of ['outer','mid','core']){const nodes=labelNodes.filter(x=>x.kind===kind);let attempts=0,changed=true;while(changed&&attempts<12){changed=false;attempts++;for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i].node.getBBox(),b=nodes[j].node.getBBox();if(boxesOverlap(a,b,3)){for(const obj of[nodes[i],nodes[j]]){const cur=parseFloat(obj.node.getAttribute('font-size')||12),floor=kind==='outer'?8.2:(kind==='mid'?9.2:12);if(cur>floor){const next=Math.max(floor,cur-.45);obj.node.setAttribute('font-size',next.toFixed(2));const spans=obj.node.querySelectorAll('tspan'),lh=next*1.08;spans.forEach((ts,k)=>ts.setAttribute('y',((k-(spans.length-1)/2)*lh).toFixed(2)));changed=true}}}}}}}
requestAnimationFrame(()=>requestAnimationFrame(collisionPass));
function select(c,m,t){document.querySelectorAll('.slice').forEach(x=>{let ok=x.dataset.c===c&&(!x.dataset.m||x.dataset.m===m)&&(!x.dataset.t||x.dataset.t===t);x.classList.toggle('dim',!ok)});document.querySelector('#path').innerHTML=`<strong>${c}</strong>${m?' → '+m:''}${t?' → <strong>'+t+'</strong>':''}`;}
document.querySelector('#reset').onclick=()=>{document.querySelectorAll('.slice').forEach(x=>x.classList.remove('dim'));document.querySelector('#path').textContent='Hover, tap, or click any word to highlight its path from broad feeling to specific vocabulary.'}
</script></body></html>

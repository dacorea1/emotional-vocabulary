<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Language for Feeling</title><style>:root{--paper:#F5EEDC;--ink:#3D382F;--brass:#9A7740}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{text-align:center;padding:28px 16px 8px}h1{font:500 clamp(28px,4vw,52px) Georgia,serif;letter-spacing:.08em;margin:0}header p{letter-spacing:.12em;font-size:12px;color:var(--brass);text-transform:uppercase}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;max-width:1600px;margin:auto;gap:20px;padding:10px 20px 44px;align-items:start}#wheelWrap{width:100%;overflow-x:auto;overflow-y:visible;padding:14px 0 24px}#wheel{display:block;width:100%;min-width:1180px;height:auto;aspect-ratio:5/4;overflow:visible}#panel{position:sticky;top:18px;border:1px solid #d8cdb6;padding:24px;background:#f8f2e4;margin-top:24px}#panel h2{font:500 30px Georgia,serif;margin:0 0 8px}#path{line-height:1.7;min-height:70px}button{background:transparent;border:1px solid var(--brass);padding:9px 14px;color:var(--ink);cursor:pointer}.slice,.callout{cursor:pointer}.slice{transition:opacity .15s,filter .15s}.slice:hover{filter:brightness(.94)}.callout-line{fill:none;stroke:#9A7740;stroke-width:1.15;opacity:.52;pointer-events:none}.callout-text{fill:#3D382F;font-size:12.5px;dominant-baseline:middle}.callout-hit{fill:transparent}.midlabel{pointer-events:none;fill:#3D382F;font-weight:650;font-size:12px}.corelabel{pointer-events:none;fill:#F5EEDC;font-weight:750;font-size:14px;letter-spacing:.04em}.dim{opacity:.13!important}@media(max-width:980px){main{grid-template-columns:1fr}#panel{order:-1;position:static;margin-top:0}#wheelWrap{padding-top:4px}#wheel{min-width:1180px}}</style></head><body><header><h1>OUR LANGUAGE FOR FEELING</h1><p>Begin at the center · move outward · find the closest word</p></header><main><div id="wheelWrap"><svg id="wheel" viewBox="0 0 1500 1200" role="img" aria-label="Interactive emotional word wheel"></svg></div><aside id="panel"><h2>What am I feeling?</h2><div id="path">Hover, tap, or click any word to highlight its path from broad feeling to specific vocabulary.</div><button id="reset">Reset</button></aside></main><script>const data={"Happy":{"Optimistic":["Inspired","Hopeful"],"Trusting":["Intimate","Sensitive"],"Peaceful":["Thankful","Loving"],"Powerful":["Creative","Courageous"],"Accepted":["Valued","Respected"],"Proud":["Confident","Successful"],"Interested":["Inquisitive","Curious"],"Content":["Joyful","Free"],"Playful":["Cheeky","Aroused"]},"Surprised":{"Excited":["Energetic","Eager"],"Amazed":["Astonished","Awe"],"Confused":["Perplexed","Disillusioned"],"Startled":["Dismayed","Shocked"]},"Bad":{"Tired":["Unfocused","Sleepy"],"Stressed":["Out of control","Overwhelmed"],"Busy":["Rushed","Pressured"],"Bored":["Apathetic","Indifferent"]},"Fearful":{"Scared":["Helpless","Frightened"],"Anxious":["Overwhelmed","Worried"],"Insecure":["Inadequate","Inferior"],"Weak":["Worthless","Insignificant"],"Rejected":["Excluded","Persecuted"],"Threatened":["Nervous","Exposed"]},"Angry":{"Let down":["Betrayed","Resentful"],"Humiliated":["Disrespected","Ridiculed"],"Bitter":["Indignant","Violated"],"Mad":["Furious","Jealous"],"Aggressive":["Provoked","Hostile"],"Frustrated":["Infuriated","Annoyed"],"Distant":["Withdrawn","Numb"],"Critical":["Skeptical","Dismissive"]},"Disgusted":{"Disapproving":["Judgmental","Embarrassed"],"Disappointed":["Appalled","Revolted"],"Awful":["Nauseated","Detestable"],"Repelled":["Horrified","Hesitant"]},"Sad":{"Lonely":["Isolated","Abandoned"],"Vulnerable":["Victimized","Fragile"],"Despair":["Grief","Powerless"],"Guilty":["Ashamed","Remorseful"],"Depressed":["Empty","Inferior"],"Hurt":["Embarrassed","Disappointed"]}},colors={"Happy":"#D4A24C","Surprised":"#A78978","Bad":"#7E8768","Fearful":"#657B70","Angry":"#A85F48","Disgusted":"#786F57","Sad":"#6E7E88"};const svg=document.querySelector('#wheel'),NS='http://www.w3.org/2000/svg',cx=750,cy=600,R=[125,250,380,470],LABEL_X={left:78,right:1422},LABEL_MIN_Y=55,LABEL_MAX_Y=1145,LABEL_GAP=25;const leaves=[];Object.entries(data).forEach(([c,ms])=>Object.entries(ms).forEach(([m,ts])=>ts.forEach(t=>leaves.push([c,m,t]))));const n=leaves.length,step=360/n,start=-90;function polar(r,a){a=a*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}function arc(r1,r2,a0,a1){const A=polar(r2,a0),B=polar(r2,a1),C=polar(r1,a1),D=polar(r1,a0);return`M${A[0]},${A[1]} A${r2},${r2} 0 0 1 ${B[0]},${B[1]} L${C[0]},${C[1]} A${r1},${r1} 0 0 0 ${D[0]},${D[1]} Z`}function el(tag,attrs={},parent=svg){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}function upright(rot){let r=((rot+180)%360)-180;if(r>90)r-=180;if(r<-90)r+=180;return r}function radialText(x,y,rotation,text,cls,size){const t=el('text',{x,y,transform:`rotate(${rotation} ${x} ${y})`,class:cls,'text-anchor':'middle','dominant-baseline':'middle','font-size':size});t.textContent=text;return t}let idx=0,ranges={},mids={},outerLabels=[];Object.entries(data).forEach(([c,ms])=>{const cs=idx;Object.entries(ms).forEach(([m,ts])=>{const s=idx;ts.forEach(t=>{const a0=start+idx*step,a1=a0+step,am=(a0+a1)/2,w=el('path',{d:arc(R[2],R[3],a0,a1),fill:colors[c],'fill-opacity':.23,stroke:'#F5EEDC','stroke-width':1.25,class:'slice','data-c':c,'data-m':m,'data-t':t});w.addEventListener('mouseenter',()=>select(c,m,t));w.addEventListener('click',()=>select(c,m,t));const anchor=polar(R[3]-2,am),bend=polar(R[3]+28,am),side=Math.cos(am*Math.PI/180)>=0?'right':'left';outerLabels.push({c,m,t,anchor,bend,side,naturalY:bend[1]});idx++});mids[c+'|'+m]=[s,idx]});ranges[c]=[cs,idx]});Object.entries(mids).forEach(([key,[s,e]])=>{const[c,m]=key.split('|'),a0=start+s*step,a1=start+e*step,am=(a0+a1)/2,w=el('path',{d:arc(R[1],R[2],a0,a1),fill:colors[c],'fill-opacity':.48,stroke:'#F5EEDC','stroke-width':1.6,class:'slice','data-c':c,'data-m':m});w.addEventListener('mouseenter',()=>select(c,m));w.addEventListener('click',()=>select(c,m));const q=polar((R[1]+R[2])/2,am);radialText(q[0],q[1],upright(am+90),m,'midlabel',m.length>12?10.8:12)});Object.entries(ranges).forEach(([c,[s,e]])=>{const a0=start+s*step,a1=start+e*step,am=(a0+a1)/2,w=el('path',{d:arc(R[0],R[1],a0,a1),fill:colors[c],'fill-opacity':.82,stroke:'#F5EEDC','stroke-width':2,class:'slice','data-c':c});w.addEventListener('mouseenter',()=>select(c));w.addEventListener('click',()=>select(c));const q=polar((R[0]+R[1])/2,am);radialText(q[0],q[1],upright(am+90),c.toUpperCase(),'corelabel',14)});el('circle',{cx,cy,r:R[0]-4,fill:'#F5EEDC',stroke:'#9A7740','stroke-width':1.5});let c1=el('text',{x:cx,y:cy-7,'text-anchor':'middle',fill:'#3D382F',style:'font:18px Georgia,serif'});c1.textContent='What am I';let c2=el('text',{x:cx,y:cy+18,'text-anchor':'middle',fill:'#3D382F',style:'font:18px Georgia,serif'});c2.textContent='feeling?';function distribute(items){items.sort((a,b)=>a.naturalY-b.naturalY);let y=LABEL_MIN_Y;items.forEach(d=>{d.y=Math.max(d.naturalY,y);y=d.y+LABEL_GAP});const overflow=items.length?items[items.length-1].y-LABEL_MAX_Y:0;if(overflow>0)items.forEach(d=>d.y-=overflow);for(let i=items.length-2;i>=0;i--)items[i].y=Math.min(items[i].y,items[i+1].y-LABEL_GAP);if(items.length&&items[0].y<LABEL_MIN_Y){const shift=LABEL_MIN_Y-items[0].y;items.forEach(d=>d.y+=shift)}}const left=outerLabels.filter(d=>d.side==='left'),right=outerLabels.filter(d=>d.side==='right');distribute(left);distribute(right);function addCallout(d){const x=LABEL_X[d.side],anchor=d.side==='right'?'start':'end',elbowX=d.side==='right'?cx+R[3]+72:cx-R[3]-72,lineEndX=d.side==='right'?x-12:x+12,g=el('g',{class:'callout','data-c':d.c,'data-m':d.m,'data-t':d.t});el('polyline',{points:`${d.anchor[0]},${d.anchor[1]} ${d.bend[0]},${d.bend[1]} ${elbowX},${d.y} ${lineEndX},${d.y}`,class:'callout-line'},g);el('rect',{x:d.side==='right'?x-8:x-228,y:d.y-10,width:236,height:20,class:'callout-hit'},g);const t=el('text',{x,y:d.y,class:'callout-text','text-anchor':anchor},g);t.textContent=d.t;g.addEventListener('mouseenter',()=>select(d.c,d.m,d.t));g.addEventListener('click',()=>select(d.c,d.m,d.t))}left.forEach(addCallout);right.forEach(addCallout);function select(c,m,t){document.querySelectorAll('.slice').forEach(x=>{const ok=x.dataset.c===c&&(!m||!x.dataset.m||x.dataset.m===m)&&(!t||!x.dataset.t||x.dataset.t===t);x.classList.toggle('dim',!ok)});document.querySelectorAll('.callout').forEach(x=>{const ok=x.dataset.c===c&&(!m||x.dataset.m===m)&&(!t||x.dataset.t===t);x.classList.toggle('dim',!ok)});document.querySelector('#path').innerHTML=`<strong>${c}</strong>${m?' → '+m:''}${t?' → <strong>'+t+'</strong>':''}`}document.querySelector('#reset').onclick=()=>{document.querySelectorAll('.slice,.callout').forEach(x=>x.classList.remove('dim'));document.querySelector('#path').textContent='Hover, tap, or click any word to highlight its path from broad feeling to specific vocabulary.'}</script></body></html>
